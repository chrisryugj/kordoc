[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "kordoc"
version = "0.2.1"
description = "Python SDK for kordoc — parse Korean documents (HWP, HWPX, PDF, DOCX, XLSX …) through a resident kordoc engine worker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "chrisryugj" }, { name = "Byeory Jeong" }]
keywords = ["hwp", "hwpx", "korean", "document", "parser", "markdown", "rag"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chrisryugj/kordoc"
Source = "https://github.com/chrisryugj/kordoc/tree/main/sdk/python"

[project.optional-dependencies]
test = ["pytest>=9.0.3", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kordoc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 300  # 한 시험이 5분을 넘기면 모든 스레드의 스택을 남긴다(멈춘 자리를 CI 로그에서 본다)
