name: Test and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
        env:
          # onnxruntime-node 설치 스크립트의 CUDA 바이너리(api.nuget.org)는 CPU 추론에 필요 없다. 다운로드 타임아웃으로
          # npm ci 가 실패하던 것(2026-09-23 두 번 연속) 방지
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
