name: Publish Python SDK

# sdk/python 을 PyPI 에 게시한다. 태그 python-vX.Y.Z 를 push 하면 돈다.
# PyPI 신뢰 게시(trusted publishing, 토큰 없음): PyPI 프로젝트 kordoc 에
# 게시자 chrisryugj/kordoc · publish-python.yml · 환경 pypi 가 등록돼 있어야 한다.
on:
  push:
    tags: ["python-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 태그·pyproject·__version__ 버전 일치 확인
        working-directory: sdk/python
        run: |
          tag="${GITHUB_REF_NAME#python-v}"
          proj=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/kordoc/__init__.py)
          echo "tag=$tag pyproject=$proj __version__=$mod"
          test "$tag" = "$proj" && test "$tag" = "$mod"
      - name: wheel·sdist 빌드
        working-directory: sdk/python
        run: |
          python -m pip install build
          python -m build -o "$GITHUB_WORKSPACE/pydist"
      - uses: actions/upload-artifact@v7
        with:
          name: pydist
          path: pydist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pydist
          path: pydist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pydist/
