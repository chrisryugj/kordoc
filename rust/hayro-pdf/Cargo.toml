[package]
name = "hayro-pdf"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# hayro 는 git 커밋으로 고정한다(재현). 바꾸면 node build.mjs 로 wasm·THIRD_PARTY/hayro-pdf.txt 를 다시 만든다.
# 지금 커밋은 upstream main 61f50b42. LaurenzV/hayro#1810(표준 글꼴의 `h.smcp` 같은 접미사 글리프 이름 폭 — pdf.js 처럼 0 이 아니게)이
# 합쳐지면 그 커밋으로 올리고 tests/pdf-occlusion-parser.test.ts 의 todo 를 뗀다
[dependencies]
hayro-interpret = { git = "https://github.com/LaurenzV/hayro", rev = "61f50b42a7f7b15764780b9ba534cba91488bb28" }
hayro-syntax = { git = "https://github.com/LaurenzV/hayro", rev = "61f50b42a7f7b15764780b9ba534cba91488bb28" }
hayro-font = { git = "https://github.com/LaurenzV/hayro", rev = "61f50b42a7f7b15764780b9ba534cba91488bb28" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
