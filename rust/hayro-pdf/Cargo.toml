[package]
name = "hayro-pdf"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# hayro 는 git 커밋으로 고정한다(재현). 바꾸면 node build.mjs 로 wasm·THIRD_PARTY/hayro-pdf.txt 를 다시 만든다.
[dependencies]
hayro-interpret = { git = "https://github.com/LaurenzV/hayro", rev = "58f11bf55df61539d82329b41cd05ca723d99ef6" }
hayro-syntax = { git = "https://github.com/LaurenzV/hayro", rev = "58f11bf55df61539d82329b41cd05ca723d99ef6" }
hayro-font = { git = "https://github.com/LaurenzV/hayro", rev = "58f11bf55df61539d82329b41cd05ca723d99ef6" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
